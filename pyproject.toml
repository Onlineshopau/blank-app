[project]
name = "blank-app-template"
version = "0.1.0"
description = "A simple Streamlit app template."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.61.1",
]

[tool.uv]
package = false
# Security: streamlit caps pillow<13, but pillow 13.0.0 fixes 8 CVEs.
# Verified streamlit st.image works with pillow 13. Remove once streamlit allows it.
override-dependencies = ["pillow>=13.0.0"]
